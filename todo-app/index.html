<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf3 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    color: #2d3142;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(45, 49, 66, 0.12);
    overflow: hidden;
  }
  header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid #eef0f4;
  }
  header h1 { font-size: 22px; font-weight: 700; }
  header .sub { font-size: 13px; color: #9096a6; margin-top: 4px; }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 20px 28px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid #e3e7ef;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .input-row input:focus { border-color: #6c8cff; }
  .add-btn {
    padding: 0 20px;
    background: #6c8cff;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .add-btn:hover { background: #556fe0; }
  .filters {
    display: flex;
    gap: 6px;
    padding: 0 28px 12px;
  }
  .filter {
    padding: 6px 14px;
    font-size: 13px;
    border: none;
    background: #f2f4f8;
    color: #6b7280;
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter.active { background: #6c8cff; color: #fff; }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border-top: 1px solid #f2f4f8;
  }
  li .check {
    width: 22px;
    height: 22px;
    border: 2px solid #cfd5e2;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  li.done .check {
    background: #34c77b;
    border-color: #34c77b;
  }
  li.done .check::after { content: "✓"; color: #fff; font-size: 13px; }
  li .text { flex: 1; font-size: 15px; word-break: break-word; }
  li.done .text { text-decoration: line-through; color: #b0b6c3; }
  li .del {
    background: none;
    border: none;
    color: #cfd5e2;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    transition: color .15s;
  }
  li .del:hover { color: #ff6b6b; }
  .empty {
    padding: 40px 28px;
    text-align: center;
    color: #b0b6c3;
    font-size: 14px;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    border-top: 1px solid #f2f4f8;
    font-size: 13px;
    color: #9096a6;
  }
  footer button {
    background: none;
    border: none;
    color: #9096a6;
    cursor: pointer;
    font-size: 13px;
  }
  footer button:hover { color: #ff6b6b; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>My To-Do List</h1>
    <div class="sub">Stay on top of your day</div>
  </header>

  <div class="input-row">
    <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off">
    <button class="add-btn" onclick="addTask()">Add</button>
  </div>

  <div class="filters">
    <button class="filter active" data-filter="all" onclick="setFilter('all', event)">All</button>
    <button class="filter" data-filter="active" onclick="setFilter('active', event)">Active</button>
    <button class="filter" data-filter="done" onclick="setFilter('done', event)">Completed</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="count">0 items left</span>
    <button onclick="clearCompleted()">Clear completed</button>
  </footer>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('todo-tasks') || '[]');
  let filter = 'all';

  function save() {
    localStorage.setItem('todo-tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text: text, done: false });
    input.value = '';
    save();
    render();
  }

  function toggle(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    render();
  }

  function del(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function setFilter(f, e) {
    filter = f;
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function render() {
    const list = document.getElementById('list');
    let visible = tasks;
    if (filter === 'active') visible = tasks.filter(t => !t.done);
    if (filter === 'done') visible = tasks.filter(t => t.done);

    if (visible.length === 0) {
      list.innerHTML = '<div class="empty">Nothing here yet ✨</div>';
    } else {
      list.innerHTML = visible.map(t => `
        <li class="${t.done ? 'done' : ''}">
          <div class="check" onclick="toggle(${t.id})"></div>
          <span class="text">${escapeHtml(t.text)}</span>
          <button class="del" onclick="del(${t.id})">&times;</button>
        </li>
      `).join('');
    }

    const left = tasks.filter(t => !t.done).length;
    document.getElementById('count').textContent =
      left + (left === 1 ? ' item left' : ' items left');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
